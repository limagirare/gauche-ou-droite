<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-950 text-slate-100 font-sans selection:bg-rose-500 selection:text-white">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAUCHE OU DROITE - Le Jeu Multijoueur en Ligne</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        lefty: '#ef4444',
                        righty: '#3b82f6',
                        gold: '#f59e0b',
                    },
                    fontFamily: {
                        serif: ['Georgia', 'serif'],
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        .compass-bg {
            background: linear-gradient(90deg, #dc2626 0%, #ef4444 35%, #64748b 50%, #3b82f6 65%, #1d4ed8 100%);
        }
        .card-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
    </style>
</head>
<body class="h-full flex flex-col justify-between overflow-x-hidden bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950 text-slate-100">

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Environment variables setup
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'gauche-ou-droite-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "demo-key",
            authDomain: "demo.firebaseapp.com",
            projectId: "demo-project",
            storageBucket: "demo.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:123456"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Sound Engine WebAudio
        class SoundFX {
            constructor() { this.ctx = null; }
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
            playTone(freq, type = 'sine', duration = 0.15, vol = 0.1) {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }
            click() { this.playTone(600, 'sine', 0.05, 0.05); }
            reveal() { this.playTone(400, 'triangle', 0.1, 0.1); setTimeout(() => this.playTone(800, 'triangle', 0.2, 0.15), 100); }
            win() { [523.25, 659.25, 783.99, 1046.50].forEach((n, i) => setTimeout(() => this.playTone(n, 'square', 0.15, 0.1), i * 80)); }
        }
        const sfx = new SoundFX();

        /* Graduations list */
        const COMPASS_GRADUATIONS = [
            { val: -100, label: "8000% G", sub: "Révolution Prolétarienne", color: "text-red-500" },
            { val: -75,  label: "800% G",  sub: "Camarade Pur Sucre", color: "text-red-400" },
            { val: -50,  label: "80% G",   sub: "Gauche Caviar / Bobo", color: "text-rose-400" },
            { val: -25,  label: "10% G",   sub: "Socio-Démocrate Modéré", color: "text-pink-300" },
            { val: 0,    label: "0%",      sub: "Centriste Ni-Ni", color: "text-slate-300" },
            { val: 25,   label: "10% D",   sub: "Libéral Pragmatique", color: "text-blue-300" },
            { val: 50,   label: "80% D",   sub: "Enfant du Ruissellement", color: "text-blue-400" },
            { val: 75,   label: "800% D",  sub: "Startup Nation First", color: "text-indigo-400" },
            { val: 100,  label: "8000% D", sub: "Ultra-Patronat Sauvage", color: "text-blue-600" }
        ];

        /* Pre-made bank of cards */
        const CARDS_DATABASE = [
            "Le Kombucha pétillant", "Manger chez McDo après une manif", "Les Mégabassines", "Léna Situations",
            "L'Académie Française", "Le glamping", "Les cheveux bleus", "Faire de la muscu", "Les escalators",
            "Faire du vélo cargo sous la pluie", "L'accord du participe passé", "Le Puy du Fou", "Les SUV en ville",
            "Le télétravail à Bali", "Regarder le JT de 13h", "Le golf le dimanche", "L'Écriture Inclusive",
            "Le vin naturel sans sulfites", "Chasser le sanglier", "Les cryptomonnaies", "Le compost de balcon",
            "Les cours de Yoga à 40€", "La Fête de l'Huma", "Le glyphosate", "Les terrasses chauffées"
        ];

        /* Main Game App Logic */
        class OnlineGameApp {
            constructor() {
                this.currentUser = null;
                this.roomCode = null;
                this.roomData = null;
                this.unsubscribeRoom = null;
                this.myCompassVal = 0;
            }

            async initAuth() {
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                } catch (err) {
                    console.error("Auth Error:", err);
                }

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        this.currentUser = user;
                        this.renderLoginScreen();
                    }
                });
            }

            getGraduationLabel(val) {
                let closest = COMPASS_GRADUATIONS[0];
                let minDiff = Math.abs(val - closest.val);
                for (let g of COMPASS_GRADUATIONS) {
                    let diff = Math.abs(val - g.val);
                    if (diff < minDiff) {
                        minDiff = diff;
                        closest = g;
                    }
                }
                return closest;
            }

            getRoomDocRef(code) {
                return doc(db, 'artifacts', appId, 'public', 'data', 'gauche_droite_rooms', code.toUpperCase());
            }

            renderLoginScreen() {
                const appElem = document.getElementById('app-container');
                appElem.innerHTML = `
                    <div class="w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-6 text-center">
                        <div class="w-16 h-16 mx-auto bg-gradient-to-tr from-red-600 via-amber-500 to-blue-600 p-[2px] rounded-full flex items-center justify-center">
                            <div class="w-full h-full bg-slate-950 rounded-full flex items-center justify-center font-black text-amber-400 text-2xl">G/D</div>
                        </div>
                        
                        <div>
                            <h2 class="text-2xl font-serif font-black tracking-tight text-white">Rejoindre le Salon Politico-Satirique</h2>
                            <p class="text-slate-400 text-xs mt-1">Entrez votre pseudo pour créer ou rejoindre une partie en ligne avec vos amis !</p>
                        </div>

                        <div class="space-y-4 text-left">
                            <div>
                                <label class="text-xs font-semibold text-slate-300 block mb-1">Votre Pseudo</label>
                                <input type="text" id="player-name-input" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm font-medium focus:outline-none focus:border-amber-500 text-white" placeholder="ex: Camarade Alexis">
                            </div>

                            <div class="grid grid-cols-2 gap-3 pt-2">
                                <button onclick="window.gameApp.createRoom()" class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-red-600 to-amber-600 hover:from-red-500 hover:to-amber-500 text-white font-bold text-xs shadow-lg transition transform active:scale-95">
                                    <i class="fa-solid fa-plus mr-1"></i> Créer un Salon (MJ)
                                </button>
                                <button onclick="window.gameApp.promptJoinRoom()" class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold text-xs shadow-lg transition transform active:scale-95">
                                    <i class="fa-solid fa-right-to-bracket mr-1"></i> Rejoindre Salon
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }

            async createRoom() {
                sfx.click();
                if (!this.currentUser) return;
                const nameInput = document.getElementById('player-name-input').value.trim() || 'Hôte MJ';
                
                // Generate room code (4 random letters)
                const roomCode = Math.random().toString(36).substring(2, 6).toUpperCase();
                this.roomCode = roomCode;

                const roomRef = this.getRoomDocRef(roomCode);
                const initialData = {
                    code: roomCode,
                    hostId: this.currentUser.uid,
                    hostName: nameInput,
                    status: 'LOBBY', // LOBBY, QUESTION_SELECTION, VOTING, REVEAL
                    activePlayerId: this.currentUser.uid,
                    activePlayerName: nameInput,
                    currentQuestion: '',
                    questionSource: 'RANDOM', // RANDOM or CUSTOM
                    secretPosition: 0,
                    votes: {}, // userId -> { value, name }
                    players: {
                        [this.currentUser.uid]: {
                            id: this.currentUser.uid,
                            name: nameInput,
                            score: 0,
                            isHost: true
                        }
                    }
                };

                await setDoc(roomRef, initialData);
                this.listenToRoom(roomCode);
            }

            promptJoinRoom() {
                sfx.click();
                const nameInput = document.getElementById('player-name-input').value.trim() || 'Joueur';
                const appElem = document.getElementById('app-container');

                appElem.innerHTML = `
                    <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-4 text-center">
                        <h3 class="text-xl font-serif font-bold text-white">Code du Salon</h3>
                        <p class="text-xs text-slate-400">Demandez le code à 4 lettres au Maître du Jeu</p>
                        
                        <input type="text" id="room-code-input" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-center text-xl font-black tracking-widest text-amber-400 uppercase focus:outline-none focus:border-amber-500" placeholder="XXXX" maxlength="4">
                        
                        <div class="flex gap-2">
                            <button onclick="window.gameApp.renderLoginScreen()" class="w-1/2 py-2.5 rounded-xl border border-slate-700 text-slate-300 font-semibold text-xs">Retour</button>
                            <button onclick="window.gameApp.joinRoomExec('${nameInput}')" class="w-1/2 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs shadow">Entrer</button>
                        </div>
                    </div>
                `;
            }

            async joinRoomExec(playerName) {
                sfx.click();
                if (!this.currentUser) return;
                const code = document.getElementById('room-code-input').value.trim().toUpperCase();
                if (!code) return;

                const roomRef = this.getRoomDocRef(code);
                const roomSnap = await getDoc(roomRef);

                if (!roomSnap.exists()) {
                    alert("Salon introuvable ! Vérifiez le code.");
                    return;
                }

                this.roomCode = code;
                const roomData = roomSnap.data();
                
                // Add player to room
                const updatedPlayers = {
                    ...roomData.players,
                    [this.currentUser.uid]: {
                        id: this.currentUser.uid,
                        name: playerName,
                        score: 0,
                        isHost: false
                    }
                };

                await updateDoc(roomRef, { players: updatedPlayers });
                this.listenToRoom(code);
            }

            listenToRoom(code) {
                const roomRef = this.getRoomDocRef(code);
                if (this.unsubscribeRoom) this.unsubscribeRoom();

                this.unsubscribeRoom = onSnapshot(roomRef, (snapshot) => {
                    if (snapshot.exists()) {
                        this.roomData = snapshot.data();
                        this.renderGameRoomUI();
                    }
                }, (error) => {
                    console.error("Room listener error:", error);
                });
            }

            renderGameRoomUI() {
                const data = this.roomData;
                const appElem = document.getElementById('app-container');
                const isHost = data.hostId === this.currentUser.uid;
                const isActivePlayer = data.activePlayerId === this.currentUser.uid;

                document.getElementById('header-room-code').textContent = `Salon: ${data.code}`;

                if (data.status === 'LOBBY') {
                    appElem.innerHTML = `
                        <div class="w-full max-w-2xl bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-6 text-center">
                            <div class="inline-block px-4 py-1 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-400 font-mono text-sm font-bold tracking-widest">
                                CODE SALON : ${data.code}
                            </div>

                            <div>
                                <h2 class="text-2xl font-serif font-black text-white">Salle d'Attente des Militants</h2>
                                <p class="text-slate-400 text-xs">Partagez ce code à vos amis pour qu'ils rejoignent sur leur téléphone ou PC !</p>
                            </div>

                            <!-- Players list -->
                            <div class="bg-slate-950 rounded-xl p-4 border border-slate-800 space-y-2 text-left">
                                <span class="text-[10px] text-slate-400 uppercase tracking-widest font-bold">Joueurs Connectés (${Object.keys(data.players).length})</span>
                                <div class="grid grid-cols-2 gap-2">
                                    ${Object.values(data.players).map(p => `
                                        <div class="flex items-center space-x-2 bg-slate-900 p-2.5 rounded-lg border border-slate-800">
                                            <div class="w-3 h-3 rounded-full ${p.isHost ? 'bg-amber-400' : 'bg-emerald-400'}"></div>
                                            <span class="text-xs font-semibold text-slate-200">${p.name} ${p.isHost ? '<span class="text-[10px] text-amber-400">(MJ/Hôte)</span>' : ''}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>

                            ${isHost ? `
                                <button onclick="window.gameApp.startQuestionSelection()" class="w-full py-3.5 px-6 rounded-xl bg-gradient-to-r from-red-600 to-amber-600 hover:from-red-500 hover:to-amber-500 text-white font-bold text-sm shadow-xl transform active:scale-95 transition">
                                    <i class="fa-solid fa-play mr-2"></i> Lancer la Partie
                                </button>
                            ` : `
                                <p class="text-xs text-amber-400/80 animate-pulse"><i class="fa-solid fa-hourglass-start mr-1"></i> En attente que le Maître du Jeu lance la partie...</p>
                            `}
                        </div>
                    `;
                } else if (data.status === 'QUESTION_SELECTION') {
                    if (isActivePlayer || isHost) {
                        appElem.innerHTML = `
                            <div class="w-full max-w-xl bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-6 text-center">
                                <div class="text-xs font-bold text-amber-400 uppercase tracking-wider">Étape : Choix du sujet par le MJ</div>
                                <h3 class="text-2xl font-serif font-black text-white">Définir l'Item du Tour</h3>

                                <div class="space-y-4 text-left">
                                    <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2">
                                        <label class="text-xs font-bold text-slate-300">Option A : Écrire votre question personnalisée</label>
                                        <input type="text" id="custom-question-input" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-amber-500" placeholder="ex: Faire son propre pain au levain...">
                                        <button onclick="window.gameApp.submitQuestion(document.getElementById('custom-question-input').value, 'CUSTOM')" class="w-full py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold rounded-lg transition">
                                            Valider la Question Personnalisée
                                        </button>
                                    </div>

                                    <div class="text-center text-xs text-slate-500 font-bold uppercase tracking-widest">— OU —</div>

                                    <button onclick="window.gameApp.submitQuestion(null, 'RANDOM')" class="w-full py-3.5 bg-gradient-to-r from-red-600 to-amber-600 hover:from-red-500 hover:to-amber-500 text-white font-bold text-xs rounded-xl shadow transition">
                                        <i class="fa-solid fa-shuffle mr-2"></i> Tirer une carte au sort dans la réserve
                                    </button>
                                </div>
                            </div>
                        `;
                    } else {
                        appElem.innerHTML = `
                            <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl text-center space-y-4">
                                <i class="fa-solid fa-pen-nib text-3xl text-amber-400 animate-bounce"></i>
                                <h3 class="text-xl font-serif font-bold text-white">Le MJ (${data.activePlayerName}) prépare la question...</h3>
                                <p class="text-xs text-slate-400">Préparez vos boussoles politiques !</p>
                            </div>
                        `;
                    }
                } else if (data.status === 'VOTING') {
                    this.renderVotingPhase();
                } else if (data.status === 'REVEAL') {
                    this.renderRevealPhase();
                }
            }

            async startQuestionSelection() {
                sfx.click();
                const roomRef = this.getRoomDocRef(this.roomCode);
                await updateDoc(roomRef, {
                    status: 'QUESTION_SELECTION',
                    votes: {}
                });
            }

            async submitQuestion(customText, type) {
                sfx.click();
                let question = customText;
                if (type === 'RANDOM' || !question) {
                    question = CARDS_DATABASE[Math.floor(Math.random() * CARDS_DATABASE.length)];
                }

                const roomRef = this.getRoomDocRef(this.roomCode);
                await updateDoc(roomRef, {
                    currentQuestion: question,
                    questionSource: type,
                    status: 'VOTING'
                });
            }

            renderVotingPhase() {
                const data = this.roomData;
                const appElem = document.getElementById('app-container');
                const isActivePlayer = data.activePlayerId === this.currentUser.uid;
                const hasVoted = data.votes && data.votes[this.currentUser.uid] !== undefined;

                const compassInfo = this.getGraduationLabel(this.myCompassVal);

                appElem.innerHTML = `
                    <div class="w-full max-w-2xl bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-2xl text-center space-y-6">
                        <div class="inline-block px-3 py-1 rounded-full bg-red-500/10 border border-red-500/30 text-red-400 text-xs font-bold uppercase tracking-wider">
                            ${isActivePlayer ? '🎯 Vous définissez la vraie position' : '🤔 Devinez la position de ' + data.activePlayerName}
                        </div>

                        <!-- Question Card -->
                        <div class="bg-slate-950 border-2 border-amber-500/50 rounded-2xl p-6 card-shadow max-w-md mx-auto">
                            <span class="text-[10px] text-slate-400 uppercase tracking-widest font-semibold block mb-1">Item en Débat</span>
                            <h3 class="text-2xl font-serif font-black text-amber-400">${data.currentQuestion}</h3>
                        </div>

                        <!-- Individual Player Compass Slider -->
                        <div class="space-y-4 max-w-xl mx-auto px-4 bg-slate-950 p-6 rounded-2xl border border-slate-800">
                            <div class="text-xs font-bold text-slate-400 uppercase tracking-widest">
                                Votre Boussole : <span class="text-amber-400 font-mono text-sm">${compassInfo.label}</span>
                            </div>

                            <input type="range" min="-100" max="100" value="${this.myCompassVal}" step="1"
                                oninput="window.gameApp.updateLocalCompass(this.value)"
                                class="w-full h-4 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-amber-400 compass-bg">

                            <p class="text-xs text-amber-400/90 font-serif italic">${compassInfo.sub}</p>
                        </div>

                        <button onclick="window.gameApp.submitCompassVote()" class="py-3 px-8 rounded-xl bg-gradient-to-r ${hasVoted ? 'from-emerald-600 to-teal-600' : 'from-amber-500 to-amber-600'} text-slate-950 font-bold text-sm shadow-xl transition transform active:scale-95">
                            <i class="fa-solid ${hasVoted ? 'fa-check' : 'fa-lock'} mr-2"></i> ${hasVoted ? 'Modifier mon Vote' : 'Verrouiller mon Vote'}
                        </button>

                        <!-- Live Voters Status -->
                        <div class="pt-4 border-t border-slate-800 text-left">
                            <div class="text-[10px] text-slate-400 uppercase tracking-widest font-bold mb-2">Statut des Boussoles :</div>
                            <div class="flex flex-wrap gap-2">
                                ${Object.values(data.players).map(p => {
                                    const voted = data.votes && data.votes[p.id] !== undefined;
                                    return `
                                        <span class="px-2.5 py-1 rounded-full border text-xs font-medium flex items-center gap-1.5 ${voted ? 'bg-emerald-950/40 border-emerald-500/50 text-emerald-300' : 'bg-slate-900 border-slate-800 text-slate-400'}">
                                            <i class="fa-solid ${voted ? 'fa-check text-emerald-400' : 'fa-spinner fa-spin'}"></i>
                                            ${p.name}
                                        </span>
                                    `;
                                }).join('')}
                            </div>
                        </div>

                        ${(data.hostId === this.currentUser.uid) ? `
                            <button onclick="window.gameApp.triggerReveal()" class="w-full mt-4 py-2 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs rounded-xl shadow">
                                <i class="fa-solid fa-eye mr-2"></i> Révéler toutes les Boussoles (MJ)
                            </button>
                        ` : ''}
                    </div>
                `;
            }

            updateLocalCompass(val) {
                this.myCompassVal = parseInt(val);
                sfx.click();
                const info = this.getGraduationLabel(this.myCompassVal);
                this.renderGameRoomUI();
            }

            async submitCompassVote() {
                sfx.click();
                const roomRef = this.getRoomDocRef(this.roomCode);
                const updatedVotes = {
                    ...this.roomData.votes,
                    [this.currentUser.uid]: {
                        value: this.myCompassVal,
                        name: this.roomData.players[this.currentUser.uid]?.name || 'Joueur'
                    }
                };

                await updateDoc(roomRef, { votes: updatedVotes });
            }

            async triggerReveal() {
                sfx.reveal();
                const roomRef = this.getRoomDocRef(this.roomCode);
                await updateDoc(roomRef, { status: 'REVEAL' });
            }

            renderRevealPhase() {
                sfx.win();
                const data = this.roomData;
                const appElem = document.getElementById('app-container');
                const activePlayerVote = data.votes[data.activePlayerId]?.value || 0;
                const targetGrad = this.getGraduationLabel(activePlayerVote);

                appElem.innerHTML = `
                    <div class="w-full max-w-3xl bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-2xl text-center space-y-6">
                        <h2 class="text-3xl font-serif font-black text-amber-400">Révélation des Boussoles !</h2>

                        <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                            <span class="text-xs text-slate-400 font-bold uppercase">Position de ${data.activePlayerName} pour "${data.currentQuestion}"</span>
                            <div class="text-2xl font-serif font-bold text-red-400 mt-1">${targetGrad.label} — ${targetGrad.sub}</div>
                        </div>

                        <!-- Comparative Compass Visualizer -->
                        <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800 space-y-4 relative">
                            <div class="text-xs uppercase tracking-widest text-slate-400 font-semibold">Toutes les boussoles des camarades</div>

                            <div class="relative w-full h-8 bg-slate-800 rounded-full compass-bg my-6 flex items-center px-2">
                                ${Object.entries(data.votes || {}).map(([pId, vObj]) => {
                                    const label = this.getGraduationLabel(vObj.value);
                                    const isTarget = pId === data.activePlayerId;
                                    const leftPct = ((vObj.value + 100) / 200) * 90 + 5;
                                    return `
                                        <div class="absolute top-1/2 -translate-y-1/2 flex flex-col items-center" style="left: ${leftPct}%;">
                                            <div class="w-4 h-4 rounded-full ${isTarget ? 'bg-red-500 ring-4 ring-red-400/50' : 'bg-amber-400'} border-2 border-slate-950 shadow"></div>
                                            <span class="absolute -top-6 whitespace-nowrap text-[9px] font-bold px-1.5 py-0.5 rounded ${isTarget ? 'bg-red-600 text-white' : 'bg-slate-800 text-amber-300'}">
                                                ${vObj.name} (${label.label})
                                            </span>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>

                        ${(data.hostId === this.currentUser.uid) ? `
                            <button onclick="window.gameApp.startQuestionSelection()" class="py-3 px-8 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold text-sm shadow-xl">
                                Tour Suivant <i class="fa-solid fa-arrow-right ml-2"></i>
                            </button>
                        ` : `
                            <p class="text-xs text-slate-400">En attente du Maître du Jeu pour le tour suivant...</p>
                        `}
                    </div>
                `;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            window.gameApp = new OnlineGameApp();
            window.gameApp.initAuth();
        });
    </script>

    <!-- Top Navigation -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-40 px-4 py-3 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="location.reload()">
            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-red-600 via-amber-500 to-blue-600 p-[2px] flex items-center justify-center shadow-md">
                <div class="w-full h-full bg-slate-900 rounded-full flex items-center justify-center font-black text-amber-400 text-lg">
                    G<span class="text-xs text-slate-400">/</span>D
                </div>
            </div>
            <div>
                <h1 class="font-serif font-bold text-lg tracking-tight text-slate-100 flex items-center gap-2">
                    GAUCHE <span class="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-amber-400 font-sans border border-slate-700">OU</span> DROITE
                </h1>
                <p class="text-[10px] uppercase tracking-widest text-slate-400 font-medium">Élysée Multiplayer Edition</p>
            </div>
        </div>

        <div id="header-room-code" class="text-xs font-mono font-bold px-3 py-1 rounded-full bg-slate-800 border border-slate-700 text-amber-400">
            Hors Ligne
        </div>
    </header>

    <!-- Dynamic Screen Container -->
    <main id="app-container" class="flex-grow container mx-auto px-4 py-6 max-w-5xl flex flex-col justify-center items-center">
        <!-- Views rendered here -->
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800/80 bg-slate-950 py-3 text-center text-xs text-slate-500">
        <p>© Enlysée Multijoueur PC - Connexion Réseau & Boussole Indépendante</p>
    </footer>
</body>
</html>
