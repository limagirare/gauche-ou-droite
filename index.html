<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --elysee-navy: #0a1128;
            --elysee-dark: #050814;
            --elysee-gold: #d4af37;
            --gauche-red: #e63946;
            --droite-blue: #1d3557;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(212, 175, 55, 0.3);
            --text-light: #f8f9fa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }

        body {
            background: radial-gradient(circle at top, #101f42 0%, var(--elysee-navy) 60%, var(--elysee-dark) 100%);
            color: var(--text-light);
            min-height: 100vh;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 10px;
            width: 100%;
            max-width: 900px;
        }

        .cockade {
            width: 36px; height: 36px; border-radius: 50%;
            background: conic-gradient(var(--gauche-red) 0 120deg, #fff 120deg 240deg, var(--droite-blue) 240deg 360deg);
            margin: 0 auto 8px auto; border: 2px solid var(--elysee-gold);
        }

        h1 { font-family: 'Cinzel', serif; font-size: 1.8rem; color: var(--elysee-gold); letter-spacing: 2px; }

        .app-container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 20px; }

        /* Mode Selector */
        .mode-switch {
            display: flex; justify-content: center; gap: 15px; background: var(--glass-bg);
            padding: 10px; border-radius: 10px; border: 1px solid var(--glass-border);
        }

        .btn-mode {
            background: transparent; border: 2px solid var(--elysee-gold); color: #fff;
            padding: 10px 20px; font-weight: 700; border-radius: 6px; cursor: pointer; transition: all 0.3s;
        }

        .btn-mode.active-gauche { background: var(--gauche-red); border-color: var(--gauche-red); }
        .btn-mode.active-droite { background: var(--droite-blue); border-color: #457b9d; }

        /* Game Board Area */
        .game-panel {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 12px; padding: 20px; backdrop-filter: blur(10px);
            display: flex; flex-direction: column; align-items: center; gap: 15px; text-align: center;
        }

        .phase-indicator {
            background: var(--elysee-gold); color: var(--elysee-dark);
            padding: 4px 12px; border-radius: 20px; font-weight: 800; font-size: 0.85rem; text-transform: uppercase;
        }

        .card-box {
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
            border: 2px solid var(--elysee-gold); border-radius: 10px;
            padding: 20px; width: 100%; max-width: 450px; min-height: 100px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .card-title { font-size: 1.3rem; font-weight: 700; margin-top: 5px; }

        /* Boussole rotative */
        .compass-box { position: relative; width: 220px; height: 110px; overflow: hidden; margin: 10px 0; }
        .compass-dial {
            width: 220px; height: 220px; border-radius: 50%;
            background: conic-gradient(from 270deg, var(--gauche-red) 0deg, #9b59b6 90deg, var(--droite-blue) 180deg, var(--droite-blue) 360deg);
            position: absolute; top: 0; left: 0; transition: transform 0.6s ease-out;
            border: 3px solid var(--elysee-gold);
        }
        .compass-needle {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 4px; height: 110px; background: #fff; z-index: 5; box-shadow: 0 0 6px #fff;
        }

        /* Voting Controls */
        .vote-options { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 10px 0; }
        .btn-vote {
            background: rgba(255,255,255,0.1); border: 1px solid var(--elysee-gold); color: #fff;
            padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: 0.2s;
        }
        .btn-vote:hover, .btn-vote.selected { background: var(--elysee-gold); color: var(--elysee-dark); font-weight: 700; }

        .btn-action {
            background: linear-gradient(135deg, var(--elysee-gold), #b8860b); color: var(--elysee-dark);
            border: none; padding: 12px 25px; font-weight: 800; border-radius: 6px; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px; transition: transform 0.1s;
        }
        .btn-action:active { transform: scale(0.98); }

        /* Hand / Cards Selection in Mode Droite */
        .hand-container { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: 100%; }
        .hand-card {
            background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border);
            border-radius: 8px; padding: 10px; width: 140px; cursor: pointer; font-size: 0.85rem;
            transition: all 0.2s;
        }
        .hand-card:hover { border-color: var(--elysee-gold); transform: translateY(-4px); }

        .score-board {
            font-family: 'Cinzel', serif; font-size: 1.1rem; color: var(--elysee-gold);
            border-top: 1px solid var(--glass-border); padding-top: 10px; width: 100%;
        }
    </style>
</head>

    <header>

            <button id="mode-droite-btn" class="btn-mode" onclick="switchGameMode('droite')">Mode de Droite (Patronal)</button>

            <div id="phase-badge" class="phase-indicator">Étape 1 : Le Camarade place le curseur</div>

            <!-- Carte courante -->
            <div class="card-box">

                <div id="card-text" class="card-title">Cliquez sur Démarrer la Partie</div>
            </div>

            <!-- Boussole interactive -->
            <div style="display:flex; justify-shadow:space-between; width:220px; font-size:0.75rem; font-weight:700;">
                <span style="color:var(--gauche-red);">GAUCHE</span>
                <span style="color:#457b9d;">DROITE</span>
            </div>
            <div class="compass-box">
                <div class="compass-needle"></div>
                <div id="compass-dial" class="compass-dial"></div>
            </div>

            <!-- Contrôles de Vote / Sélection -->
            <div id="interactive-area" style="width:100%;">
                <!-- Injecté dynamiquement par le JS -->
            </div>

            <button id="main-action-btn" class="btn-action" onclick="handleMainAction()">Lancer une Partie</button>

            <div class="score-board">

        let selectedVoteAngle = null;
        let score = 0;
        let round = 0;

            { label: "100% GAUCHE", angle: -80 },

            { label: "10% GAUCHE", angle: -15 },

            { label: "100% DROITE", angle: 80 }

        function switchGameMode(mode) {
            currentMode = mode;
            document.getElementById('mode-gauche-btn').className = mode === 'gauche' ? 'btn-mode active-gauche' : 'btn-mode';
            document.getElementById('mode-droite-btn').className = mode === 'droite' ? 'btn-mode active-droite' : 'btn-mode';
            resetGame();
        }

        function resetGame() {
            currentStep = 0;
            score = 0;
            round = 0;
            document.getElementById('score-val').innerText = '0';
            document.getElementById('round-val').innerText = '0';
            document.getElementById('card-text').innerText = "Cliquez sur Démarrer la Partie";
            document.getElementById('compass-dial').style.transform = "rotate(0deg)";
            document.getElementById('interactive-area').innerHTML = "";
            document.getElementById('main-action-btn').innerText = "Lancer la partie";
            document.getElementById('phase-badge').innerText = "Prêt à jouer";
        }

        function handleMainAction() {
            if (currentStep === 0) {
                nextRound();
            } else if (currentStep === 1) {
                if (currentMode === 'gauche') {
                    // Masquer le cadran avant que les camarades votent
                    document.getElementById('compass-dial').style.transform = "rotate(0deg)";
                    currentStep = 2;
                    renderVotingUI();
                } else {
                    // Mode droite : le Boss a fixé la consigne, les joueurs ont soumis leur carte
                    currentStep = 2;
                    renderBossChoiceUI();
                }
            } else if (currentStep === 2) {
                // Révélation des résultats
                revealResult();
            } else if (currentStep === 3) {
                nextRound();
            }
        }

        function nextRound() {
            if (round >= 10) {
                alert(`Partie terminée ! Score final : ${score} points.`);
                resetGame();
                return;
            }
            round++;
            document.getElementById('round-val').innerText = round;
            currentStep = 1;

            // Tirer une carte au hasard
            currentCardIndex = Math.floor(Math.random() * CARDS.length);
            document.getElementById('card-text').innerText = CARDS[currentCardIndex];
            document.getElementById('card-num').innerText = `PROPOSITION #${currentCardIndex + 1}`;

            if (currentMode === 'gauche') {
                document.getElementById('phase-badge').innerText = "Étape 1 : Le Camarade place son avis en secret";
                renderSecretPositionUI();
            } else {
                // Mode de droite : Le Boss tire un bord politique au hasard
                targetAngle = POSITIONS[Math.floor(Math.random() * POSITIONS.length)].angle;
                document.getElementById('compass-dial').style.transform = `rotate(${targetAngle}deg)`;
                document.getElementById('phase-badge').innerText = "Étape 1 : Le Boss impose l'orientation politique !";
                renderBossHandUI();
            }
        }

        // --- UI MODE DE GAUCHE ---
        function renderSecretPositionUI() {
            const area = document.getElementById('interactive-area');
            area.innerHTML = `<p style="font-size:0.85rem; margin-bottom:8px;">Camarade, choisissez votre position exacte :</p>`;
            
            const btnGroup = document.createElement('div');
            btnGroup.className = 'vote-options';
            
            POSITIONS.forEach(pos => {
                const btn = document.createElement('button');
                btn.className = 'btn-vote';
                btn.innerText = pos.label;
                btn.onclick = () => {
                    targetAngle = pos.angle;
                    document.getElementById('compass-dial').style.transform = `rotate(${targetAngle}deg)`;
                    document.querySelectorAll('.btn-vote').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                };
                btnGroup.appendChild(btn);
            });
            area.appendChild(btnGroup);
            document.getElementById('main-action-btn').innerText = "Valider la position en secret";
        }

        function renderVotingUI() {
            document.getElementById('phase-badge').innerText = "Étape 2 : Les camarades débattent et votent !";
            const area = document.getElementById('interactive-area');
            area.innerHTML = `<p style="font-size:0.85rem; margin-bottom:8px;">Selon vous, quelle était la position du Camarade ?</p>`;
            
            const btnGroup = document.createElement('div');
            btnGroup.className = 'vote-options';
            
            POSITIONS.forEach(pos => {
                const btn = document.createElement('button');
                btn.className = 'btn-vote';
                btn.innerText = pos.label;
                btn.onclick = () => {
                    selectedVoteAngle = pos.angle;
                    document.querySelectorAll('.btn-vote').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                };
                btnGroup.appendChild(btn);
            });
            area.appendChild(btnGroup);
            document.getElementById('main-action-btn').innerText = "Révéler les votes !";
        }

        // --- UI MODE DE DROITE ---
        function renderBossHandUI() {
            const area = document.getElementById('interactive-area');
            area.innerHTML = `<p style="font-size:0.85rem; margin-bottom:8px;">Joueurs, proposez la carte de votre main qui convient au Boss :</p>`;
            
            const handBox = document.createElement('div');
            handBox.className = 'hand-container';

            // Générer 3 cartes de main fictives
            for(let i=0; i<3; i++) {
                let randomIdx = Math.floor(Math.random() * CARDS.length);
                let cardEl = document.createElement('div');
                cardEl.className = 'hand-card';
                cardEl.innerText = CARDS[randomIdx];
                cardEl.onclick = () => {
                    document.querySelectorAll('.hand-card').forEach(c => c.style.borderColor = 'rgba(212,175,55,0.3)');
                    cardEl.style.borderColor = '#e63946';
                    document.getElementById('card-text').innerText = CARDS[randomIdx];
                };
                handBox.appendChild(cardEl);
            }
            area.appendChild(handBox);
            document.getElementById('main-action-btn').innerText = "Soumettre les cartes au Boss";
        }

        function renderBossChoiceUI() {
            document.getElementById('phase-badge').innerText = "Étape 3 : Le Boss choisit le gagnant sans s'expliquer";
            const area = document.getElementById('interactive-area');
            area.innerHTML = `<p style="font-size:0.9rem; color:var(--elysee-gold);">Le Patron étudie les soumissions...</p>`;
            document.getElementById('main-action-btn').innerText = "Le Boss valide & attribue le point";
        }

        // --- REVELATION & SCORE ---
        function revealResult() {
            currentStep = 3;
            document.getElementById('compass-dial').style.transform = `rotate(${targetAngle}deg)`;
            
            if (currentMode === 'gauche') {
                const diff = Math.abs(targetAngle - (selectedVoteAngle !== null ? selectedVoteAngle : 0));
                let earned = 0;
                if (diff === 0) earned = 3;
                else if (diff <= 35) earned = 1;

                score += earned;
                document.getElementById('phase-badge').innerText = earned > 0 ? `GAGNÉ ! (+${earned} pts)` : "RÉVOLUTION ÉCHOUÉE ! (0 pt)";
            } else {
                score += 1;
                document.getElementById('phase-badge').innerText = "LE BOSS A TRANCHÉ ! (+1 pt au fayot)";
            }

            document.getElementById('score-val').innerText = score;
            document.getElementById('interactive-area').innerHTML = `<p style="font-size:0.85rem;">Position réelle affichée sur la boussole.</p>`;
            document.getElementById('main-action-btn').innerText = round < 10 ? "Manche Suivante" : "Voir le Score Final";
        }
    </script>
</body>
</html>
