<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gauche / Droite Client</title>
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #333333;
      --primary-color: #0066cc;
      --left-color: #e63946;
      --right-color: #1d3557;
      --border-radius: 12px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      max-width: 500px;
      width: 100%;
      padding: 24px;
      box-sizing: border-box;
    }

    h1 {
      text-align: center;
      margin-top: 0;
      color: #111;
    }

    .status-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 0.9rem;
      background-color: #eee;
      margin-bottom: 20px;
    }

    .status-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #888;
    }

    .status-indicator.online { background-color: #2ec4b6; }
    .status-indicator.offline { background-color: #e63946; }
    .status-indicator.loading { background-color: #ff9f1c; }

    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 14px 16px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.2s ease;
      color: white;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-left {
      background-color: var(--left-color);
    }

    .btn-right {
      background-color: var(--right-color);
    }

    .btn-fetch {
      background-color: var(--primary-color);
      width: 100%;
    }

    .response-box {
      margin-top: 20px;
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 8px;
      padding: 12px;
      font-family: monospace;
      font-size: 0.85rem;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 200px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Gauche / Droite</h1>

    <!-- État de la connexion au serveur Render -->
    <div class="status-badge">
      <div id="statusDot" class="status-indicator loading"></div>
      <span id="statusText">Connexion au serveur...</span>
    </div>

    <!-- Boutons d'action -->
    <div class="actions-grid">
      <button class="btn-left" onclick="sendAction('gauche')">👈 Gauche</button>
      <button class="btn-right" onclick="sendAction('droite')">Droite 👉</button>
    </div>

    <button class="btn-fetch" onclick="fetchData()">🔄 Rafraîchir les données</button>

    <!-- Affichage des résultats / réponses API -->
    <div id="output" class="response-box">En attente de données...</div>
  </div>

  <script>
    const SERVER_URL = 'https://gauche-droite-server.onrender.com';

    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const output = document.getElementById('output');

    // Vérifier l'état du serveur Render au chargement
    async function checkServerStatus() {
      setStatus('loading', 'Réveil du serveur Render...');
      try {
        const response = await fetch(`${SERVER_URL}/health`, { method: 'GET' })
          .catch(() => fetch(`${SERVER_URL}/`, { method: 'GET' }));

        if (response.ok) {
          setStatus('online', 'Serveur connecté');
        } else {
          setStatus('offline', `Erreur serveur (${response.status})`);
        }
      } catch (err) {
        setStatus('offline', 'Serveur inaccessible');
        console.error(err);
      }
    }

    function setStatus(state, text) {
      statusDot.className = `status-indicator ${state}`;
      statusText.innerText = text;
    }

    // Fonction pour envoyer un choix (Gauche ou Droite)
    async function sendAction(choice) {
      output.innerText = `Envoi du choix: ${choice}...`;
      try {
        const response = await fetch(`${SERVER_URL}/api/action`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ choice: choice, timestamp: new Date().toISOString() })
        });

        const data = await response.json();
        output.innerText = JSON.stringify(data, null, 2);
      } catch (err) {
        output.innerText = `Erreur lors de l'envoi vers le serveur:\n${err.message}`;
      }
    }

    // Fonction pour récupérer des données depuis le serveur
    async function fetchData() {
      output.innerText = 'Chargement des données...';
      try {
        const response = await fetch(`${SERVER_URL}/api/data`);
        const data = await response.json();
        output.innerText = JSON.stringify(data, null, 2);
      } catch (err) {
        output.innerText = `Erreur de récupération:\n${err.message}`;
      }
    }

    // Initialisation
    checkServerStatus();
  </script>
</body>
</html>
